[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-flare-jepa"
version = "0.1.0"
description = "Feasibility and data foundation for uncertainty-aware solar telemetry forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<3", "xarray>=2024.6",
  "netCDF4==1.7.2", "matplotlib>=3.8", "pyarrow>=16", "certifi>=2024.6",
]

[project.optional-dependencies]
aditya = ["astropy>=6", "cdflib>=1.3"]
test = ["pytest>=8"]
training = ["torch>=2.6,<3"]
stats = ["statsmodels>=0.14.5,<0.15", "arch>=7.2,<8", "scipy>=1.13"]
dashboard = ["streamlit==1.50.0", "plotly==6.3.1"]
dashboard-prediction = ["streamlit==1.50.0", "plotly==6.3.1", "torch==2.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solar_flare_jepa.dashboard" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
