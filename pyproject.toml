[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-flare-jepa"
version = "0.1.0"
description = "Feasibility and data foundation for uncertainty-aware solar telemetry forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<3", "xarray>=2024.6",
  "netCDF4==1.7.2", "matplotlib>=3.8", "pyarrow>=16", "certifi>=2024.6",
]

[project.optional-dependencies]
aditya = ["astropy>=6", "cdflib>=1.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
